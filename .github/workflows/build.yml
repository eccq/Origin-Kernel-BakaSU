name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: samakshkambxj/Origin-Kernel
          ref: mt6878/Tetris/16b
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential clang flex \
            libelf-dev libssl-dev lld llvm pahole python3 rsync zip

      - name: Add root driver
        run: |
          mkdir KernelSU && cd KernelSU
          git init -q
          git remote add origin https://github.com/ReSukiSU/ReSukiSU
          # exact commit from the Galaxian build, else latest
          git fetch --depth=1 origin 9cf787a7127d835b41753074d0b91f376351d264 || git fetch --depth=1 origin HEAD
          git checkout -q FETCH_HEAD
          git log -1 --oneline
          cd ..
          ln -sfn ../KernelSU/kernel drivers/kernelsu
          grep -q kernelsu drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q kernelsu drivers/Kconfig || sed -i '$i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          echo "CONFIG_KSU=y" >> arch/arm64/configs/gki_defconfig

      - name: Build
        env:
          KCFLAGS: -Wno-error=uninitialized -Wno-error=sometimes-uninitialized -Wno-error=attribute-warning -Wno-frame-larger-than
        run: |
          M="make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1"
          $M gki_defconfig
          scripts/config --file out/.config -d KASAN -d UBSAN
          $M olddefconfig
          grep -q "^CONFIG_KSU=y" out/.config || { echo "KSU not enabled"; exit 1; }
          grep -E "^CONFIG_(KASAN|UBSAN)=" out/.config || echo "KASAN/UBSAN off"
          $M -j$(nproc)

      - name: Collect output
        run: |
          mkdir artifacts
          cp out/arch/arm64/boot/Image artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: tetris-kernel
          path: artifacts/
          if-no-files-found: error
