name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: samakshkambxj/Origin-Kernel
          ref: mt6878/Tetris/16b
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential clang flex \
            libelf-dev libssl-dev lld llvm pahole python3 rsync zip

      # Add ReSukiSU to the kernel tree (same version as the Galaxian build)
      - name: Add root driver
        run: |
          git clone https://github.com/ReSukiSU/ReSukiSU KernelSU
          git -C KernelSU checkout 9cf787a7127d835b41753074d0b91f376351d264
          ln -sfn ../KernelSU/kernel drivers/kernelsu
          grep -q kernelsu drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q kernelsu drivers/Kconfig || sed -i '$i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          echo "CONFIG_KSU=y" >> arch/arm64/configs/gki_defconfig

      - name: Build
        run: |
          make O=out ARCH=arm64 gki_defconfig
          grep -q "^CONFIG_KSU=y" out/.config || { echo "KSU not enabled"; exit 1; }
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 \
            KCFLAGS="-Wno-error=uninitialized -Wno-error=sometimes-uninitialized -Wno-error=attribute-warning -Wno-frame-larger-than" \
            -j"$(nproc)"

      - name: Collect output
        run: |
          mkdir artifacts
          cp out/arch/arm64/boot/Image artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: tetris-kernel
          path: artifacts/
          if-no-files-found: error
